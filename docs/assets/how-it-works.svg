<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="How Kekkai works: declare, guard, widen, review"><rect width="1000" height="300" rx="16" fill="#F6F5F1"/><text x="500.0" y="32" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#5B6270">One task under Kekkai</text><rect x="30.0" y="52" width="214" height="200" rx="14" fill="#FFFFFF" stroke="#D9D6CE" stroke-width="1.5"/><circle cx="60.0" cy="84" r="14" fill="#F7E3DE" stroke="#C23B22" stroke-width="2"/><text x="60.0" y="89" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#C23B22">1</text><text x="84.0" y="90" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#12161C">Declare</text><text x="48.0" y="128" font-family="ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#C23B22">declare_scope</text><text x="48.0" y="160" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5B6270">The agent says what the</text><text x="48.0" y="182" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5B6270">task is for and the paths</text><text x="48.0" y="204" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5B6270">or zones it will change.</text><path d="M250.0 152.0h16m-6 -6l6 6l-6 6" fill="none" stroke="#C23B22" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="272.0" y="52" width="214" height="200" rx="14" fill="#FFFFFF" stroke="#D9D6CE" stroke-width="1.5"/><circle cx="302.0" cy="84" r="14" fill="#F7E3DE" stroke="#C23B22" stroke-width="2"/><text x="302.0" y="89" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#C23B22">2</text><text x="326.0" y="90" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#12161C">Guard</text><text x="290.0" y="128" font-family="ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#C23B22">PreToolUse hook</text><text x="290.0" y="160" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5B6270">Edit, Write outside the</text><text x="290.0" y="182" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5B6270">scope: refused, with the</text><text x="290.0" y="204" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5B6270">scope and what to do.</text><path d="M492.0 152.0h16m-6 -6l6 6l-6 6" fill="none" stroke="#C23B22" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="514.0" y="52" width="214" height="200" rx="14" fill="#FFFFFF" stroke="#D9D6CE" stroke-width="1.5"/><circle cx="544.0" cy="84" r="14" fill="#F7E3DE" stroke="#C23B22" stroke-width="2"/><text x="544.0" y="89" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#C23B22">3</text><text x="568.0" y="90" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#12161C">Widen</text><text x="532.0" y="128" font-family="ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#C23B22">widen_scope</text><text x="532.0" y="160" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5B6270">Needs more? It widens,</text><text x="532.0" y="182" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5B6270">with a reason the</text><text x="532.0" y="204" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5B6270">reviewer sees.</text><path d="M734.0 152.0h16m-6 -6l6 6l-6 6" fill="none" stroke="#C23B22" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="756.0" y="52" width="214" height="200" rx="14" fill="#FFFFFF" stroke="#D9D6CE" stroke-width="1.5"/><circle cx="786.0" cy="84" r="14" fill="#F7E3DE" stroke="#C23B22" stroke-width="2"/><text x="786.0" y="89" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#C23B22">4</text><text x="810.0" y="90" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#12161C">Review</text><text x="774.0" y="128" font-family="ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#C23B22">Stop hook</text><text x="774.0" y="160" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5B6270">The git diff, shell writes</text><text x="774.0" y="182" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5B6270">included, and your checks.</text><text x="774.0" y="204" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5B6270">Fails: back to work, once.</text><text x="500.0" y="284" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5B6270">Edits in the scope get no answer from Kekkai: your own Claude Code permissions apply as before.</text></svg>
