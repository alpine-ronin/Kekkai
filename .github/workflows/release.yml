name: Release

# Publishes a release when a version tag is pushed (git tag v0.2.0 && git push origin v0.2.0): the PHAR and the
# executables (built, smoke-tested and attested by binaries.yml), SHA256SUMS, and VERSION, which `kekkai self-update`
# reads. A tag with a hyphen (v1.0.0-rc.1) is a pre-release: never what install.sh calls the latest.
# Packagist follows the tags by itself once the package is submitted there.

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    uses: ./.github/workflows/binaries.yml
    with:
      version: ${{ github.ref_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: kekkai*
          path: dist
          merge-multiple: true
      - name: Checksums and version
        run: |
          cd dist
          printf '%s\n' "${GITHUB_REF_NAME#v}" > VERSION
          sha256sum kekkai* > SHA256SUMS
          cat SHA256SUMS
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## " v "( |$)" {on=1; next} on && /^## / {exit} on {print}' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
          cat notes.md
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=''
          case "$GITHUB_REF_NAME" in *-*) prerelease=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --title "Kekkai ${GITHUB_REF_NAME#v}" --notes-file notes.md $prerelease
